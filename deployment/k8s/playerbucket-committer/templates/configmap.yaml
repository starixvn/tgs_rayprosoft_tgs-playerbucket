apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "playerbucket-committer.fullname" . }}
data:
  appsettings.json: |
    {
      "OpenTelemetry": {
        "Tracing": {
          "Endpoint": "http://localhost:4317",
          "ExportProcessorType": "Batch"
        }
      },
    }
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:

    processors:
      batch:

    exporters:
      otlp:
        endpoint: "$NODE_IP:4317"
        tls:
          insecure: true
      prometheus:
        endpoint: "0.0.0.0:8889"
        namespace: "tgs_player_bucket"

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions: [health_check]
    
    pipelines:
      traces: 
        receivers: [otlp]
        processors:
          - batch
        exporters: [otlp]
      metrics:
        receivers: [otlp]
        exporters: [prometheus]
