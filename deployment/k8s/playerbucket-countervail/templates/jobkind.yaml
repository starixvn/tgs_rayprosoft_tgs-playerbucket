apiVersion: batch/v1
{{- if eq .Values.kind "CronJob" }}
kind: CronJob
{{- else }}
kind: Job
{{- end }}
metadata:
  name: {{ include "playerbucket-countervail.fullname" . }}
  labels:
    {{- include "playerbucket-countervail.labels" . | nindent 4 }}
spec:
  {{- if eq .Values.kind "CronJob" }}
  schedule: "0 0 * * *"
  {{- else }}
  ttlSecondsAfterFinished: 86400
  backoffLimit: 3
  {{- end }}
  jobTemplate:
    spec:
      template:
        metadata:
          {{- with .Values.podAnnotations }}
          annotations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          labels:
            {{- include "playerbucket-countervail.selectorLabels" . | nindent 12 }}
        spec:
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 10 }}
          {{- end }}
          serviceAccountName: {{ include "playerbucket-countervail.serviceAccountName" . }}
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          containers:
          - name: {{ .Chart.Name }}
            image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
            imagePullPolicy: {{ .Values.image.pullPolicy }}
            env:
              - name: ConnectionStrings__Tgs
                valueFrom:
                  secretKeyRef:
                    name: tgs-connections
                    key: tgs
              - name: ConnectionStrings__Redis
                valueFrom:
                  secretKeyRef:
                    name: tgs-connections
                    key: redis
              - name: Tool__WorkerBaseUrl
                value: http://{{ .Release.Name }}-playerbucket-worker
          restartPolicy: OnFailure
          {{- with .Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 8 }}
          {{- end }}
          {{- with .Values.affinity }}
          affinity:
            {{- toYaml . | nindent 8 }}
          {{- end }}
          {{- with .Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 8 }}
          {{- end }}