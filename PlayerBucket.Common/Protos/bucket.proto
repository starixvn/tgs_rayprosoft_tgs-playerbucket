syntax = "proto3";

option csharp_namespace = "Tgs.Services.PlayerBucket.Protos";

import "phoenix/protobuf/guid.proto";
import "phoenix/protobuf/decimal.proto";

message BidRequest {
	string player_code = 1;
}

message CommitBidRequest {
	phoenix.protobuf.GuidValue bucket_id = 1;
}

message BidResponse {
	string token = 1;
}

message CreateBucketRequest {
	string player_code = 1;
	phoenix.protobuf.DecimalValue amount = 2;
	string bucket_type = 3;
	string external_id = 4;
	string remark = 5;
}

message CreateBucketResponse {
	phoenix.protobuf.GuidValue bucket_id = 1;
}

message FillInRequest {
	string player_code = 1;
	phoenix.protobuf.DecimalValue amount = 2;
	string fill_type = 3;
	string external_id = 4;
	string remark = 5;
}

message SnapshotRequest {
	phoenix.protobuf.GuidValue bucket_id = 1;
	string player_code = 2;
}

message GetBucketAmountRequest {
	string player_code = 1;
}

message GetBucketAmountResponse {
	phoenix.protobuf.DecimalValue amount = 1;
	phoenix.protobuf.GuidValue anchor_bucket_id = 2;
}

message ExtendExpiryRequest {
	string player_code = 1;
}

message CleanBucketRequest {
	string player_code = 1;
	phoenix.protobuf.GuidValue anchor_bucket_id = 2;
	string external_id = 3;
	string remark = 4;
}
