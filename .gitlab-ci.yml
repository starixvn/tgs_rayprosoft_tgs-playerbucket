include:
  - project: rayprosoft/tgs-ci-scripts
    ref: main
    file: GitLab/Templates/gitlab-job-templates.yml

variables:
  ServiceImageName: pgtgs/bucket-service
  WorkerImageName: pgtgs/bucket-worker
  CommitterImageName: pgtgs/bucket-committer
  MigrateJobImageName: pgtgs/bucket-mitrate-job
  CountervailImageName: pgtgs/bucket-countervail
  TgsServiceSettingKey: playerbucket-service
  TgsWorkerSettingKey: playerbucket-worker
  TgsCommitterSettingKey: playerbucket-committer
  HelmTemplateServiceFolderName: playerbucket-service
  HelmTemplateWorkerFolderName: playerbucket-worker
  HelmTemplateCommitterFolderName: playerbucket-committer
  HelmTemplateMigrateJobFolderName: playerbucket-migrate-job
  HelmTemplateCountervailFolderName: playerbucket-countervail
  BuildCacheKey: Tgs.PlayerBucket.$CI_PIPELINE_IID

stages:
  - build
  - test
  - publish
  - deploy-dev
  - deploy-staging
  - deploy-prod

build-code:
  extends: .build-code-template

unit-test:
  extends: .unit-test-template

push-nuget:
  extends: .push-nuget-template
  script:
    - push_package "PlayerBucket.Client"
    - push_package "PlayerBucketType.Client"
  artifacts:
    paths:
      - PlayerBucket.Client/bin/$BuildConfiguration/*.nupkg
      - PlayerBucketType.Client/bin/$BuildConfiguration/*.nupkg

push-docker-image:
  extends: .push-docker-image-template
  script:
    - push_docker "PlayerBucketService/PlayerBucketService.csproj" $ServiceImageName $Tag
    - push_docker "Tgs.PlayerBucketWorker/Tgs.PlayerBucketWorker.csproj" $WorkerImageName $Tag
    - push_docker "PlayerBucket.Committer/PlayerBucket.Committer.csproj" $CommitterImageName $Tag

push-job-image:
  extends: .push-docker-image-template
  script:
    - push_docker "PlayerBucketMigrateJob/PlayerBucketMigrateJob.csproj" $MigrateJobImageName $Tag
    - push_docker "RefreshAllBucketsTool/RefreshAllBucketsTool.csproj" $CountervailImageName $Tag

push-k8s-template:
  extends: .push-k8s-template
  script:
    - push_k8s_template $HelmTemplateServiceFolderName $ServiceImageName $Tag
    - push_k8s_template $HelmTemplateWorkerFolderName $WorkerImageName $Tag
    - push_k8s_template $HelmTemplateCommitterFolderName $CommitterImageName $Tag

push-job-k8s-template:
  extends: .push-k8s-template
  script:
    - push_k8s_template $HelmTemplateMigrateJobFolderName $MigrateJobImageName $Tag
    - push_k8s_template $HelmTemplateCountervailFolderName $CountervailImageName $Tag

.deploy-job-template:
  extends: .deploy-template
  before_script:
    - !reference [.deploy-template, before_script]
    - |
      function deploy_k8s() {
        local helmFolderName=$1
        local ns=$2
        local extendSettings=${3:-$(</dev/stdin)}

        local dedicated=$(kubectl get cm tgs-settings -o jsonpath={.data.dedicated})
        local node_selector=$(kubectl get cm tgs-settings -o jsonpath={.data.node-selector})

        local valueConfig=$(
          cat << EOF
          {
            "replicaCount": $replica,
            "nodeSelector": $node_selector,
            "tolerations": [$dedicated]
          }
      EOF
        )

        echo $valueConfig $extendSettings | jq -s 'reduce .[] as $item ({}; . * $item)' \
          | yq e -P | helm template artifacts/k8s/${helmFolderName:=$HelmTemplateFolderName} \
          -n ${ns:$namespace} \
          --name-template $name_template \
          -f - 

        echo $valueConfig $extendSettings | jq -s 'reduce .[] as $item ({}; . * $item)' \
          | yq e -P | helm template artifacts/k8s/${helmFolderName:=$HelmTemplateFolderName} \
          -n ${ns:$namespace} \
          --name-template $name_template \
          -f - \
          | kubectl -n ${ns:=$namespace} apply -f -
      }

deploy-service-dev:
  extends: .deploy-template
  variables:
    namespace: dev
    kube_config: KubeConfig_Raypro_dev
  environment:
    name: service-dev
  stage: deploy-dev
  needs:
    - push-nuget
    - push-docker-image
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  when: on_success
  script:
    - |
      cat << EOF | deploy_k8s $TgsServiceSettingKey $HelmTemplateServiceFolderName $namespace
        {
          "restart": {
            "enabled": true,
            "schedule": "0 23 * * *"
          }
        }
      EOF

